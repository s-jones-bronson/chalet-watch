name: chalet-watch
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      nights:
        description: "Comma-separated nights to check (default 2026-11-06,2026-11-07)"
        required: false
        default: ""
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python3 check.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NIGHTS: ${{ inputs.nights }}
